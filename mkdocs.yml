site_name: PCL Rustic
site_url: https://ArkWhale.github.io/pcl-rustic/
site_description: 高性能 Python 点云处理库 - 基于 Rust + Burn 张量框架
site_author: liuzhen19

repo_url: https://github.com/ArkWhale/pcl-rustic
repo_name: pcl-rustic
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.action.edit

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

nav:
  - 首页: index.md
  - 快速开始:
    - 安装: getting-started/installation.md
    - 基本使用: getting-started/basic-usage.md
    - 示例: getting-started/examples.md
  - API 文档:
    - 概览: api/overview.md
    - PointCloud: api/pointcloud.md
    - 下采样: api/downsample.md
    - 坐标变换: api/transform.md
    - 异常点过滤: api/outlier.md
    - 配准: api/registration.md
    - 文件 I/O: api/io.md
  - RFC:
    - 概览: plans/README.md
    - RFC-0001: plans/rfc-0001-2026-04-30-pcl-rustic-roadmap.md
    - RFC-0002: plans/rfc-0002-2026-04-30-api-reset-and-typed-attributes.md
    - RFC-0003: plans/rfc-0003-2026-04-30-coord-ops-and-selection.md
    - RFC-0004: plans/rfc-0004-2026-04-30-gpu-hot-path.md
    - RFC-0005: plans/rfc-0005-2026-04-30-knn-and-normals.md
    - RFC-0006: plans/rfc-0006-2026-04-30-outlier-removal.md
    - RFC-0007: plans/rfc-0007-2026-04-30-icp-gicp-registration.md
    - RFC-0008: plans/rfc-0008-2026-05-04-kdtree-fallback-and-gicp-staging.md
    - RFC-0009: plans/rfc-0009-2026-05-04-large-scale-benchmark-suite.md
    - RFC-0010: plans/rfc-0010-2026-05-07-host-typed-attribute-storage.md
    - RFC-0011: plans/rfc-0011-2026-05-07-completion-evidence-gates.md
    - RFC-0012: plans/rfc-0012-2026-05-07-rfc0004-device-residency-scope.md
    - RFC-0013: plans/rfc-0013-2026-05-07-las-point-format-10.md
    - RFC-0014: plans/rfc-0014-2026-05-08-las-point-format-10-api-policy.md
    - RFC-0015: plans/rfc-0015-2026-05-08-open3d-comparison-charts.md
  - 性能:
    - 基准测试: performance/benchmarks.md
    - Open3D 对比: performance/open3d-comparison.md
    - 优化建议: performance/optimization.md
  - 开发:
    - 环境设置: development/setup.md
    - 贡献指南: development/contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ArkWhale/pcl-rustic
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  version:
    provider: mike

